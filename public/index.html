<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Registry</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><div class="eyebrow">NODE.JS × AWS RDS</div><h1>User Registry</h1><p class="intro">Save a username to your MySQL database in one click.</p><form id="userForm"><label for="username">Username</label><div class="form-row"><input id="username" name="username" type="text" maxlength="100" required placeholder="Enter your name" autocomplete="name"><button type="submit">Save user <span>→</span></button></div></form><p id="message" role="status" aria-live="polite"></p><div class="list-head"><h2>Saved users</h2><button id="refresh" class="secondary" type="button">↻ Refresh</button></div><ul id="users"><li class="empty">Loading users…</li></ul><p class="footer">Powered by Express &amp; MySQL</p></main><script src="script.js"></script></body></html>
